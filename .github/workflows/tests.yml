name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install
        run: |
          pip install ".[dev]"
          playwright install chromium --with-deps

      - name: Lint
        run: ruff check diffqa benchmarks tests

      - name: Unit and browser end-to-end tests
        run: python -m pytest -q

      - name: Offline benchmark (real browser, mock model)
        run: diffqa eval --provider mock
