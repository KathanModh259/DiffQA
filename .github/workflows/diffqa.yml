name: DiffQA Autonomous PR Regression Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  diffqa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install DiffQA & Dependencies
        run: |
          pip install -e .
          playwright install chromium --with-deps

      - name: Generate PR Git Diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          echo "Generated PR diff size: $(wc -l < pr.diff) lines"

      - name: Run DiffQA Autonomous Agent
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          DIFFQA_CODE_MODEL: meta/muse-code
          DIFFQA_AGENT_MODEL: meta/muse-spark
          DIFFQA_JUDGE_MODEL: meta/muse-wonder
        run: |
          # Use local server or preview deployment URL
          diffqa run --diff pr.diff --url http://localhost:3000 --output ./diffqa_output

      - name: Post DiffQA Report to PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = './diffqa_output/DIFFQA_REPORT.md';
            if (fs.existsSync(path)) {
              const body = fs.readFileSync(path, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

