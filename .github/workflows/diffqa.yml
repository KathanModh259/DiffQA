name: DiffQA Autonomous PR Regression Testing

# Setup: add the secret MODEL_API_KEY (Meta Model API) and the repository variable
# DIFFQA_PREVIEW_URL (your PR preview deployment). Without the variable this job is skipped.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  diffqa-test:
    if: ${{ vars.DIFFQA_PREVIEW_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install DiffQA
        run: |
          pip install .
          playwright install chromium --with-deps

      - name: Generate PR diff
        run: git diff origin/${{ github.base_ref }}...HEAD > pr.diff

      - name: Run DiffQA
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        # Exits 1 when a regression is found, failing this job.
        run: diffqa run --diff pr.diff --url "${{ vars.DIFFQA_PREVIEW_URL }}" --provider meta --output ./diffqa_output ${{ vars.DIFFQA_BASE_URL && format('--base-url "{0}"', vars.DIFFQA_BASE_URL) || '' }}

      - name: Upload screenshots, specs and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffqa-output
          path: diffqa_output/
          if-no-files-found: ignore

      - name: Post report as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './diffqa_output/DIFFQA_REPORT.md';
            if (!fs.existsSync(path)) return;
            let body = fs.readFileSync(path, 'utf8');
            const limit = 65000;  // GitHub rejects comments over 65536 chars
            if (body.length > limit) body = body.slice(0, limit) + '\n\n_Report truncated; see the diffqa-output artifact._';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
