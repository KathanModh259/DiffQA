[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffqa"
version = "0.1.0"
description = "Autonomous PR regression testing agent — maps code diffs to browser test flows, catches regressions, and synthesizes Playwright specs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kathan Modh", email = "kathanmodh25@gmail.com" }
]
keywords = [
    "qa", "testing", "agent", "playwright", "regression",
    "llm", "diff", "meta", "autonomous", "browser-testing",
    "ci-cd", "github-actions"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "playwright>=1.42.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "unidiff>=0.7.5",
    "jinja2>=3.1.3",
    "pillow>=10.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
diffqa = "diffqa.cli:app"

[project.urls]
Homepage = "https://github.com/KathanModh259/DiffQA"
Repository = "https://github.com/KathanModh259/DiffQA"
Issues = "https://github.com/KathanModh259/DiffQA/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.black]
line-length = 120
target-version = ["py310"]
